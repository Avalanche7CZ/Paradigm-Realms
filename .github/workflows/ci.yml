name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Paradigm-Realms
      - uses: actions/checkout@v4
        with:
          repository: Avalanche7CZ/Paradigm
          ref: 4b2e7c3cd2e8526060f8bb3d8edad4d866646b63
          path: Paradigm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve release version
        working-directory: Paradigm-Realms
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test -n "$version"
          echo "REALMS_VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - name: Build companion API
        working-directory: Paradigm
        run: |
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          ./gradlew :common:apiJar --no-daemon --console=plain
          mapfile -t api_jars < <(find common/build/libs -maxdepth 1 -name 'paradigm-api-*.jar' ! -name '*-sources.jar' -print)
          test "${#api_jars[@]}" = 1
          echo "PARADIGM_API_PATH=$(realpath "${api_jars[0]}")" >> "$GITHUB_ENV"
      - name: Clean aggregate build
        working-directory: Paradigm-Realms
        run: ./gradlew clean build --no-daemon --console=plain --warning-mode all -PparadigmApiPath="$PARADIGM_API_PATH"
      - name: Whitespace audit
        working-directory: Paradigm-Realms
        run: git diff --check
      - name: Release artifact audits
        working-directory: Paradigm-Realms
        run: python3 scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: paradigm-realms-${{ env.REALMS_VERSION }}
          if-no-files-found: error
          path: |
            Paradigm-Realms/Fabric-1.21.1/build/libs/paradigm-realms-fabric-1.21.1-${{ env.REALMS_VERSION }}.jar
            Paradigm-Realms/Forge-1.21.1/build/libs/paradigm-realms-forge-1.21.1-${{ env.REALMS_VERSION }}.jar
            Paradigm-Realms/NeoForge-1.21.1/build/libs/paradigm-realms-neoforge-1.21.1-${{ env.REALMS_VERSION }}.jar
